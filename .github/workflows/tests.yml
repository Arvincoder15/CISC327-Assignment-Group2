
name: Equipment Rental Management CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: equipment-rental-management

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run existing tests with coverage
        run: python -m pytest -v --ignore=tests/e2e --cov=app --cov-report=term-missing --cov-fail-under=90

  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: equipment-rental-management

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start Flask application
        run: |
          python -m flask --app run:app run --host=127.0.0.1 --port=5000 > /tmp/flask.log 2>&1 &

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask application is ready"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/flask.log
          exit 1

      - name: Run Playwright E2E tests
        run: python -m pytest tests/e2e -v
